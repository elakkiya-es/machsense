<title>MachSense</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&display=swap">
<style>
/* Layout: a product console. Slim app bar, two views (Live monitor / Savings), loom list · loom detail · alert feed in three columns */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f0f2f7; --ink:#101632; --ink-2:#5b6482; --ink-3:#8b93ad; --line:#e2e5ee;
  --accent:#4655d4; --accent-2:#7a86ff; --accent-soft:#eceefe;
  --ok:#17905a; --ok-soft:#e2f5ec; --warn:#c07a0c; --warn-soft:#fcf1dc; --crit:#d23f3a; --crit-soft:#fde7e5; --idle:#6c7390; --idle-soft:#eceef4;
  --shadow:0 1px 2px rgba(16,22,50,.05),0 6px 20px rgba(16,22,50,.05);
  --ui:"Plus Jakarta Sans","Noto Sans Tamil","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Malayalam","Noto Sans Kannada","Segoe UI",system-ui,sans-serif;
  --num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0e1b; --surface:#11172a; --surface-2:#171f36; --ink:#e8ebf6; --ink-2:#98a1bd; --ink-3:#6b7493; --line:#222b46;
  --accent:#8f9bff; --accent-2:#b4bcff; --accent-soft:#1b2247;
  --ok:#43c987; --ok-soft:#10291f; --warn:#f0b04b; --warn-soft:#2e2412; --crit:#ff7066; --crit-soft:#341719; --idle:#9aa2bd; --idle-soft:#1c2339;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e1b; --surface:#11172a; --surface-2:#171f36; --ink:#e8ebf6; --ink-2:#98a1bd; --ink-3:#6b7493; --line:#222b46;
  --accent:#8f9bff; --accent-2:#b4bcff; --accent-soft:#1b2247;
  --ok:#43c987; --ok-soft:#10291f; --warn:#f0b04b; --warn-soft:#2e2412; --crit:#ff7066; --crit-soft:#341719; --idle:#9aa2bd; --idle-soft:#1c2339;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;min-height:62px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;overflow:hidden;flex:none}
.mark::before{content:"";position:absolute;inset:7px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.95) 0 2px,transparent 2px 5px);border-radius:2px}
.mark::after{content:"";position:absolute;left:5px;right:5px;top:14px;height:2px;background:rgba(255,255,255,.95)}
.logo b{font-weight:800;font-size:1.12rem;letter-spacing:-.01em}
.logo small{display:block;font-size:.74rem;color:var(--ink-2);font-weight:500;margin-top:-2px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;margin-left:auto}
.tab{all:unset;cursor:pointer;padding:7px 14px;border-radius:7px;font-weight:600;font-size:.88rem;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab:focus-visible{outline:2px solid var(--accent)}
.simtag{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:5px 10px;border-radius:999px}
.simtag i{width:7px;height:7px;border-radius:50%;background:var(--warn);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:720px){.tabs{margin-left:0;order:3;width:100%}.tab{flex:1;text-align:center}.bar .wrap{padding-block:10px;gap:10px}.simtag{margin-left:auto}}

main{padding-block:22px 40px}
.intro{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.intro h1{font-size:1.45rem;font-weight:800;letter-spacing:-.015em}
.intro p{color:var(--ink-2);font-size:.92rem;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.label{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px;display:grid;gap:4px}
.kpi b{font-family:var(--num);font-size:1.55rem;font-weight:600;letter-spacing:-.02em}
.kpi span{font-size:.8rem;color:var(--ink-2)}
.kpi b.crit{color:var(--crit)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpi:last-child{grid-column:1/-1}}

/* monitor grid */
.grid{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:250px minmax(0,1fr)}.feed{grid-column:1/-1}}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:.95rem;font-weight:700}

.looms{display:grid;gap:8px;padding:10px}
@media (max-width:760px){.looms{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.looms{grid-template-columns:1fr}}
.loom{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);transition:border-color .2s,background .2s}
.loom:hover{border-color:var(--line)}
.loom[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.loom:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.loom .nm{font-weight:700;font-size:.92rem}
.loom canvas{grid-column:1/-1;width:100%;height:26px;display:block}
.loom .mini{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--num);font-size:.72rem;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.crit{color:var(--crit);background:var(--crit-soft)} .pill.idle{color:var(--idle);background:var(--idle-soft)}

.detail{display:grid}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.dhead .sub{color:var(--ink-2);font-size:.82rem;width:100%;margin-top:-6px}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:16px;padding:16px 18px}
@media (max-width:560px){.dbody{grid-template-columns:1fr}}
.charts{display:grid;gap:12px;min-width:0}
.chart{min-width:0}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.chart-h b{font-size:.84rem;font-weight:600}
.chart-h span{font-size:.74rem;color:var(--ink-3)}
.chart canvas{display:block;width:100%;height:120px;border-radius:8px;background:var(--surface-2)}
.side{display:grid;gap:10px;align-content:start}
.ring{display:grid;place-items:center;position:relative;padding:4px 0}
.ring svg{width:130px;height:130px;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--surface-2);stroke-width:10}
.ring .val{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s,stroke .4s}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--num);font-size:1.6rem;font-weight:600}
.ring .c span{font-size:.7rem;color:var(--ink-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.metric{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.metric span{font-size:.78rem;color:var(--ink-2)}
.metric b{font-family:var(--num);font-size:.95rem;font-weight:600}
.metric b em{font-style:normal;color:var(--ink-3);font-size:.75rem;font-weight:400;margin-left:2px}
.sim{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
.sim .label{margin-right:4px}
.sbtn{all:unset;cursor:pointer;font-size:.82rem;font-weight:600;padding:7px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,transform .1s}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}
.sbtn:active{transform:translateY(1px)}
.sbtn:focus-visible{outline:2px solid var(--accent)}
.auto{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-2)}
.switch{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--accent)} .switch:checked::after{left:16px}

/* feed */
.feed .list{list-style:none;margin:0;padding:8px;display:grid;gap:6px;max-height:640px;overflow:auto}
.al{border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.al button.top{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:10px 12px;align-items:start}
.al button.top:focus-visible{outline:2px solid var(--accent);border-radius:10px}
.al .dot{width:9px;height:9px;border-radius:50%;margin-top:5px}
.al.crit .dot{background:var(--crit)} .al.warn .dot{background:var(--warn)} .al.ok .dot{background:var(--ok)}
.al .msg{font-size:.86rem;font-weight:600}
.al .meta{grid-column:2;font-size:.74rem;color:var(--ink-3);font-family:var(--num)}
.al .why{font-size:.74rem;font-weight:700;color:var(--accent);white-space:nowrap}
.al .ev{padding:0 12px 12px 31px;display:grid;gap:8px}
.al table{width:100%;border-collapse:collapse;font-size:.78rem}
.al th{font-weight:600;color:var(--ink-3);text-align:left;padding:4px 6px;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}
.al td{padding:5px 6px;border-top:1px solid var(--line)}
.al td.n{font-family:var(--num);text-align:right;white-space:nowrap}
.al td.bad{color:var(--crit);font-weight:600}
.al .verdict{font-size:.8rem;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.al .verdict b{color:var(--ink)}
.al.open{border-color:var(--accent)}
.feed .foot{padding:10px 16px;border-top:1px solid var(--line);font-size:.76rem;color:var(--ink-3)}

/* savings */
.sv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
@media (max-width:980px){.sv{grid-template-columns:1fr}}
.inputs{padding:6px 18px 16px}
.group{padding-block:12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.group:last-child{border-bottom:none}
.group h3{font-size:.8rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.field{display:grid;grid-template-columns:1fr 110px;gap:4px 14px;align-items:center}
.field label{font-size:.88rem;font-weight:500}
.field small{grid-column:1;font-size:.74rem;color:var(--ink-3);margin-top:-4px}
.field .in{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:0 8px;grid-row:span 2}
.field .in input{all:unset;width:100%;font-family:var(--num);font-size:.92rem;padding:7px 0;text-align:right}
.field .in span{font-size:.75rem;color:var(--ink-3);margin-left:6px;white-space:nowrap}
.field .in:focus-within{border-color:var(--accent)}
input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}
.results{display:grid;gap:14px}
.hero{padding:22px;background:linear-gradient(135deg,#2f3bb8,#5f6cf0);color:#fff;border:none;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 9px)}
.hero .label{color:rgba(255,255,255,.8)}
.hero .big{font-family:var(--num);font-size:clamp(2.2rem,5vw,3.1rem);font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.hero .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;position:relative;z-index:1}
.hero .row div{background:rgba(255,255,255,.14);border-radius:10px;padding:10px 12px}
.hero .row b{display:block;font-family:var(--num);font-size:1.2rem;font-weight:600}
.hero .row span{font-size:.74rem;color:rgba(255,255,255,.85)}
@media (max-width:480px){.hero .row{grid-template-columns:1fr}}
.brk{padding:16px 18px;display:grid;gap:14px}
.brow{display:grid;grid-template-columns:120px 1fr 96px;gap:12px;align-items:center;font-size:.86rem}
.brow .b{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.brow .b i{display:block;height:100%;border-radius:6px;transition:width .35s}
.brow b{font-family:var(--num);text-align:right;font-weight:600}
@media (max-width:420px){.brow{grid-template-columns:90px 1fr 84px}}
.formula{padding:16px 18px;display:grid;gap:10px}
.formula details{border-radius:10px;background:var(--surface-2);padding:10px 12px}
.formula summary{cursor:pointer;font-weight:600;font-size:.86rem}
.formula code{display:block;font-family:var(--num);font-size:.76rem;color:var(--ink-2);margin-top:8px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.note{font-size:.76rem;color:var(--ink-3);padding:0 18px 16px}
.payback{padding:16px 18px}
.pb-track{position:relative;height:36px;margin-top:10px}
.pb-track canvas{width:100%;height:120px;display:block}
footer{color:var(--ink-3);font-size:.78rem;padding-block:6px 30px}
[hidden]{display:none!important}
/* controls: theme + language */
.ctrls{display:flex;align-items:center;gap:8px}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);transition:border-color .2s,color .2s}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn svg{width:18px;height:18px}
.iconbtn .moon{display:none}
:root[data-theme="dark"] .iconbtn .sun{display:none} :root[data-theme="dark"] .iconbtn .moon{display:block}
.langsel{position:relative;display:flex;align-items:center;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);padding-left:10px}
.langsel:focus-within{border-color:var(--accent)}
.langsel svg{width:16px;height:16px;flex:none}
.langsel select{all:unset;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--ink);padding:0 28px 0 8px;height:100%}
.langsel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.langsel option{color:#101632;background:#fff}
:root:not([lang="en"]) .label,:root:not([lang="en"]) .group h3,:root:not([lang="en"]) .ring .c span{letter-spacing:0;text-transform:none}
.loom .pill{max-width:150px;white-space:normal;text-align:center;line-height:1.25}
@media (max-width:720px){.ctrls{margin-left:auto}.simtag{margin-left:0}}
/* history */
.tag{display:inline-flex;font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.hcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media (max-width:1000px){.hcards{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.hcards{grid-template-columns:1fr}}
.hc{padding:14px 16px;display:grid;gap:4px}
.hc b{font-family:var(--num);font-size:1.45rem;font-weight:600;letter-spacing:-.02em}
.hc b.pos{color:var(--ok)} .hc b.neg{color:var(--crit)}
.delta{font-family:var(--num);font-size:.78rem;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta span{font-family:var(--ui);font-weight:500;color:var(--ink-3)}
.up-good,.down-good{color:var(--ok)} .up-bad,.down-bad{color:var(--crit)} .neutral{color:var(--ink-2)}
.ba{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:14px}
.ba>div{padding:16px 18px;border-right:1px solid var(--line);display:grid;gap:8px;min-width:0}
.ba>div:last-child{border-right:none}
.ba .pair{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ba .pair em{font-style:normal;font-size:.72rem;color:var(--ink-3);display:block}
.ba .pair b{font-family:var(--num);font-size:1.15rem;font-weight:600}
.ba .arrow{color:var(--ink-3);font-size:1.1rem}
.ba .after b{color:var(--ok)}
@media (max-width:800px){.ba{grid-template-columns:1fr}.ba>div{border-right:none;border-bottom:1px solid var(--line)}.ba>div:last-child{border-bottom:none}}
.hcharts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media (max-width:900px){.hcharts{grid-template-columns:1fr}}
.hchart{padding:16px 18px}
.hchart canvas{display:block;width:100%;height:210px;margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cmp{margin-bottom:14px}
.cmp-sel{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cmp-sel select{font:600 .86rem var(--ui);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.cmp-sel select:focus-visible{outline:2px solid var(--accent)}
.tw{overflow-x:auto}
.ht{width:100%;border-collapse:collapse;font-size:.84rem}
.ht th{font-size:.72rem;font-weight:600;color:var(--ink-3);text-align:right;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
.ht th:first-child,.ht td:first-child{text-align:left}
.ht td{padding:10px 12px;border-top:1px solid var(--line);text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.ht td:first-child{font-family:var(--ui);font-weight:600}
.ht td.pos{color:var(--ok);font-weight:600} .ht td.neg{color:var(--crit);font-weight:600}
.ht tr.inst td{background:var(--accent-soft)}
.ht .mk{font-family:var(--ui);font-size:.66rem;font-weight:700;color:var(--accent);margin-left:6px}
.all{min-width:980px}
.hnote{font-size:.76rem;color:var(--ink-3);padding:12px 18px 16px}

/* ---- polish ---- */
.tab{display:inline-flex;align-items:center;gap:7px}
.tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (max-width:720px){.tab{flex-direction:column;gap:3px;font-size:.74rem;padding:7px 4px}}
.intro{position:relative;overflow:hidden;padding:20px 22px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(120deg,var(--accent-soft),var(--surface) 62%);box-shadow:var(--shadow)}
.intro::after{content:"";position:absolute;right:-30px;top:-50%;width:300px;height:200%;transform:rotate(14deg);background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,transparent) 0 2px,transparent 2px 10px);pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000 40%)}
.intro>*{position:relative;z-index:1}
.card{transition:box-shadow .25s,transform .25s}
.kpi:hover,.hc:hover{transform:translateY(-2px)}
section[role=tabpanel]:not([hidden]){animation:fadein .35s ease}
@keyframes fadein{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpi b,.hc b{background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--ink) 70%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi b.crit,.hc b.pos,.hc b.neg{-webkit-text-fill-color:currentColor;background:none}

/* view switch */
.vswitch{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:10px}
.vswitch button{all:unset;cursor:pointer;padding:7px 14px;border-radius:7px;font-size:.84rem;font-weight:600;color:var(--ink-2)}
.vswitch button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.vswitch button:focus-visible{outline:2px solid var(--accent)}

/* weaver view */
.weaver{display:grid;gap:14px}
.wv-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px}
.wv-bar p{color:var(--ink-2);font-size:.9rem}
.voicenote{font-size:.8rem;color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{padding:20px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;position:relative;overflow:hidden}
.lamp{grid-row:span 3;width:78px;height:78px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#ffffffb0,transparent 42%),var(--lc);box-shadow:0 0 0 6px color-mix(in srgb,var(--lc) 18%,transparent),0 0 34px color-mix(in srgb,var(--lc) 55%,transparent)}
.lamp.blink{animation:blink 1s infinite}
@keyframes blink{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--lc) 10%,transparent),0 0 6px color-mix(in srgb,var(--lc) 20%,transparent);filter:brightness(.75)}}
.tile .no{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.tile .tx{font-size:.95rem;font-weight:600}
.tile .speakb{justify-self:start}
.tile{cursor:pointer}.tile[aria-current="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.tile.crit{background:linear-gradient(140deg,var(--crit-soft),var(--surface) 70%)}
.tile.warn{background:linear-gradient(140deg,var(--warn-soft),var(--surface) 70%)}

/* listen */
.how3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:14px}
.how3>div{padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;border-right:1px solid var(--line)}
.how3>div:last-child{border-right:none}
.how3 .ic{grid-row:span 2;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--num);font-weight:700}
.how3 b{font-size:.9rem} .how3 span{font-size:.78rem;color:var(--ink-2)}
@media (max-width:800px){.how3{grid-template-columns:1fr}.how3>div{border-right:none;border-bottom:1px solid var(--line)}.how3>div:last-child{border-bottom:none}}
.lsbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.lsbar .src{font-weight:700;font-size:.92rem;margin-right:auto;display:flex;align-items:center;gap:8px;min-width:0}
.play{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9px;background:var(--accent);color:var(--surface);font-weight:700;font-size:.86rem}
.play:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.play svg{width:14px;height:14px;fill:currentColor}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.lswave{padding:14px 18px;display:grid;gap:12px}
.lswave canvas{display:block;width:100%;border-radius:10px;background:var(--surface-2)}
#cWave{height:170px} #cRate{height:140px}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--ink-2)}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lsres{display:grid;grid-template-columns:repeat(3,1fr) 1.6fr;gap:12px;margin-top:14px}
@media (max-width:900px){.lsres{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.lsres{grid-template-columns:1fr}}
.lsres .hc b{font-size:1.35rem}
.verdict-card{padding:14px 16px;display:grid;gap:6px;align-content:start}
.verdict-card .vt{font-size:1rem;font-weight:700}
.verdict-card.ok{background:linear-gradient(140deg,var(--ok-soft),var(--surface) 70%)}
.verdict-card.bad{background:linear-gradient(140deg,var(--crit-soft),var(--surface) 70%)}
.lsnote{font-size:.76rem;color:var(--ink-3);margin-top:10px}
.err{color:var(--crit);font-size:.82rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

(function(){

const gauss = ()=> (Math.random()+Math.random()+Math.random()-1.5)/1.5;
const inr = v => (v<0?'−':'')+'₹' + Math.round(Math.abs(v)).toLocaleString('en-IN');
const store = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };

/* ---------------- language ---------------- */
let LANG = store.get('ms-lang'); if(!I18N[LANG]) LANG='en';
const t = (k,vars) => { let s = (I18N[LANG][k] ?? I18N.en[k] ?? k); if(vars) for(const v in vars) s = s.replace('{'+v+'}', vars[v]); return s; };

  document.documentElement.lang = LANG;

function fit(c){
  const r=c.getBoundingClientRect(), d=window.devicePixelRatio||1, w=Math.max(1,Math.round(r.width*d)), h=Math.max(1,Math.round(r.height*d));

  const x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0); return [x,r.width,r.height];
}
function series(c, data, max, color, base, thin){

  const pad = thin?2:8;
  if(!thin){ x.strokeStyle=css('--line'); x.lineWidth=1; for(let i=1;i<4;i++){const y=h*i/4; x.beginPath(); x.moveTo(0,y); x.lineTo(w,y); x.stroke();} }
  const Y = v => h - pad - Math.min(1,v/max)*(h-pad*2);

  if(data.length<2) return;

  x.strokeStyle=color; x.lineWidth=thin?1.2:1.7; x.lineJoin='round'; x.stroke();
  x.lineTo(w,h); x.lineTo(0,h); x.closePath();

}

const R = (k,normal,now,bad)=>({k,normal,now,bad});

function trigger(L,e){
  if(L.ev && L.ev!=='bearing') return;
  L.ev=e; L.evT=0; L.flag=false;
  if(e==='idle'){ L.state='idle'; L.idleT=0; return; }
  L.state='running'; if(e==='bearing') L.wear=0;
}

function step(L,dt){
  L.evT+=dt; L.t+=dt; L.allT+=dt; if(L.state==='running' && (!L.ev || L.ev==='bearing')) L.runT+=dt;
  const e=L.ev;
  if(e==='thread'){
    if(L.evT>2.2 && !L.flag){ L.flag=true;
      alert(L,'crit','a_thread','th'+L.id,[R('m_ppm',L.basePpm+' /min',L.ppm+' /min',L.ppm<L.basePpm*0.9),R('m_cv','2%',Math.round(L.cv)+'%',true),R('cur',L.baseAmp.toFixed(1)+' A',L.amp.toFixed(1)+' A',false),R('m_temp','≈46 °C',L.temp.toFixed(0)+' °C',false)],'v_thread');
      fabric += 5*M_PER_MIN; }
    if(L.evT>6 && L.state==='running') L.state='stopped';
    if(L.evT>16){ L.state='running'; L.ev=null; open.delete('th'+L.id); alert(L,'ok','a_threadOk'); }
  }
  if(e==='overload'){
    if(L.evT>1.2 && !L.flag){ L.flag=true;
      alert(L,'crit','a_ovl','ov'+L.id,[R('cur',L.baseAmp.toFixed(1)+' A',L.amp.toFixed(1)+' A',true),R('r_above','< 20%','+'+Math.round((L.amp/L.baseAmp-1)*100)+'%',true),R('m_ppm',L.basePpm+' /min',L.ppm+' /min',false),R('m_temp','≈46 °C',L.temp.toFixed(0)+' °C',false)],'v_ovl'); }
    if(L.evT>4 && L.state==='running') L.state='stopped';
    if(L.evT>14){ L.state='running'; L.ev=null; open.delete('ov'+L.id); alert(L,'ok','a_ovlOk'); }
  }
  if(e==='heat'){
    if(L.evT<18) L.temp+=1.6*dt;
    if(L.temp>70 && !L.flag){ L.flag=true;
      alert(L,'crit','a_heat','ht'+L.id,[R('m_temp','≈46 °C',L.temp.toFixed(0)+' °C',true),R('r_rise','< 0.2 °C/min','+1.6 °C/min',true),R('cur',L.baseAmp.toFixed(1)+' A',L.amp.toFixed(1)+' A',L.amp>L.baseAmp*1.15),R('m_ppm',L.basePpm+' /min',L.ppm+' /min',false)],'v_heat'); }
    if(L.evT>18 && L.state==='running') L.state='stopped';
    if(L.evT>34){ L.state='running'; L.ev=null; open.delete('ht'+L.id); alert(L,'ok','a_heatOk'); }
  }
  if(e==='bearing'){
    L.wear=Math.min(1,L.wear+dt/18);
    if(L.wear>.55 && !L.flag){ L.flag=true;
      alert(L,'warn','a_brg','br'+L.id,[R('m_rms',L.baseRms.toFixed(2)+' g',L.rms.toFixed(2)+' g',true),R('r_above','< 15%','+'+Math.round((L.rms/L.baseRms-1)*100)+'%',true),R('m_ppm',L.basePpm+' /min',L.ppm+' /min',false),R('cur',L.baseAmp.toFixed(1)+' A',L.amp.toFixed(1)+' A',false)],'v_brg'); }
    if(L.evT>45){ L.ev=null; L.wear=0; open.delete('br'+L.id); alert(L,'ok','a_brgOk'); }
  }
  if(e==='idle'){
    L.idleT+=dt;
    if(L.idleT>15 && !L.flag){ L.flag=true;
      alert(L,'warn','a_idle','id'+L.id,[R('m_ppm',L.basePpm+' /min','0 /min',true),R('cur','@r_offA',L.amp.toFixed(1)+' A',true),R('r_idleT','—','15 min',true),R('r_wasted','—',(IDLE_KW*15/60).toFixed(2)+' kWh',true)],'v_idle'); }
    if(L.evT>40){ L.state='running'; L.ev=null; L.idleT=0; open.delete('id'+L.id); alert(L,'ok','a_idleOk'); }
  }
  if(e!=='heat'){ const tgt=L.state==='running'?44+L.basePpm/90:35; L.temp+=(tgt-L.temp)*0.004; }

  let ppmNow=0;
  for(let s=0;s<Math.round(dt*SPS);s++){
    let v=.04+Math.abs(gauss())*.035, a;
    if(L.state==='running'){
      const irr = e==='thread' && L.evT>.5;
      const ppm = L.basePpm*(irr?rnd(.55,1.15):1+gauss()*.006);
      const before=Math.floor(L.phase); L.phase+=ppm/60/SPS; const f=L.phase%1;
      const miss = irr && Math.floor(L.phase)%3===1;
      if(Math.floor(L.phase)>before && !miss){ L.picks.push(L.t+s/SPS); if(L.picks.length>10) L.picks.shift(); }
      if(f<.14 && !miss) v+=(1-f/.14)*L.baseRms*2.6;
      v+=L.wear*(.22+Math.abs(gauss())*.42);
      a=L.baseAmp+gauss()*.1+(f<.14?.22:0);
      if(e==='overload'&&L.evT>.3) a+=Math.min(4.2,L.evT*2.2);
      if(e==='heat') a+=Math.max(0,(L.temp-55)*.04);
      ppmNow=ppm;
    } else if(L.state==='idle'){ v=.025+Math.abs(gauss())*.015; a=1.1+gauss()*.04; }
    else { v=.008+Math.abs(gauss())*.006; a=.02; }
    L.vib.push(Math.max(0,v)); L.cur.push(Math.max(0,a)); if(L.vib.length>WIN){L.vib.shift();L.cur.shift();}
  }
  const last=L.vib.slice(-SPS*2); L.rms=Math.sqrt(last.reduce((s,x)=>s+x*x,0)/Math.max(1,last.length));
  L.amp=L.cur.slice(-SPS).reduce((s,x)=>s+x,0)/SPS;
  if(L.state==='running'){
    L.ppm=Math.round(ppmNow+gauss()*1.5);
    if(L.picks.length>4){ const iv=[]; for(let i=1;i<L.picks.length;i++) iv.push(L.picks[i]-L.picks[i-1]);
      const m=iv.reduce((a,b)=>a+b,0)/iv.length, sd=Math.sqrt(iv.reduce((a,b)=>a+(b-m)**2,0)/iv.length); L.cv=L.cv*.7+(sd/m*100)*.3; }
  } else { L.ppm=0; L.cv=L.cv*.9; }
  let sc=.04+Math.abs(gauss())*.015;
  if(L.state==='running'){ sc+=Math.max(0,L.rms/L.baseRms-1.12)*.55+Math.max(0,L.amp/L.baseAmp-1.2)*.5+Math.max(0,(L.temp-58)/20)+Math.max(0,(L.cv-6)/40); }
  if(L.state==='stopped') sc=.88; if(L.state==='idle') sc=Math.min(.7,.18+L.idleT/30);
  L.score=Math.min(1,L.score*.85+sc*.15);
  if(L.state==='idle') kwh+=IDLE_KW*dt/60;
}

function buildInputs(){

function calc(){
  const mpm=S.ppm/(S.ppcm*100);
  const fabM = S.looms*S.breaks*Math.max(0,S.tBefore-S.tAfter)*mpm*S.days;
  const fab = fabM*S.loss;
  const kwhM = S.looms*S.idleH*S.idleKw*(S.cut/100)*S.days;
  const en = kwhM*S.tariff;
  const rep = S.looms*S.fails*(S.prevent/100)*S.repair/12;
  const tot=fab+en+rep, kit=S.looms*S.kit, pay= tot>0? kit/tot : Infinity;
  $('rMonth').textContent=inr(tot);
  $('rPay').textContent= isFinite(pay)? (pay<1? '< 1' : pay.toFixed(1)) : '—';
  $('rYear').textContent=inr(tot*12-kit);
  $('rLoom').textContent=inr(tot/Math.max(1,S.looms));
  const items=[[t('b_fab'),fab,'--accent',t('b_fabS',{m:fabM.toFixed(0)})],[t('b_rep'),rep,'--warn',t('b_repS',{n:(S.looms*S.fails*S.prevent/100).toFixed(1)})],[t('b_en'),en,'--ok',kwhM.toFixed(0)+' kWh']];
  const mx=Math.max(1,...items.map(i=>i[1]));
  $('brk').innerHTML=items.map(([n,v,c,s])=>`<div class="brow"><span>${n}<br><small style="color:var(--ink-3);font-size:.72rem">${s}</small></span><span class="b"><i style="width:${v/mx*100}%;background:var(${c})"></i></span><b>${inr(v)}</b></div>`).join('');
  const f2=(n,d=2)=>(+n).toLocaleString('en-IN',{maximumFractionDigits:d});
  const opened = [...$('formula').querySelectorAll('details')].map(d=>d.open);
  $('formula').innerHTML=`
  <details${opened.length?(opened[0]?' open':''):' open'}><summary>${t('b_fab')} · ${inr(fab)}</summary><code>${t('x_speed')} = ${S.ppm} ÷ (${S.ppcm} × 100) = ${f2(mpm,3)} m/min
${t('x_metres')} = ${S.looms} ${t('x_looms')} × ${S.breaks} ${t('x_breaks')} × (${S.tBefore} − ${S.tAfter}) min × ${f2(mpm,3)} m/min × ${S.days} ${t('x_days')} = ${f2(fabM,0)} m
${t('x_saving')} = ${f2(fabM,0)} m × ₹${S.loss} = ${inr(fab)}</code></details>
  <details${opened[1]?' open':''}><summary>${t('b_rep')} · ${inr(rep)}</summary><code>${S.looms} ${t('x_looms')} × ${S.fails} ${t('x_perYear')} × ${S.prevent}% ${t('x_prevented')} × ₹${f2(S.repair,0)} ÷ 12 ${t('x_months')} = ${inr(rep)}</code></details>

const LS={sr:16000, data:null, isSample:true, name:'', res:null, ctx:null, src:null, t0:0, playing:false};
function makeSample(){
  const sr=16000, dur=20, N=sr*dur, a=new Float32Array(N); let seed=7; const r=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  const per=60/180; let tp=0.15, k=0;
  while(tp<dur){
    let next=per*(1+(r()-.5)*.03), play=true;
    if(tp>11 && tp<15){ next=per*(1+(r()-.5)*.35); if(k%3===1) play=false; }
    if(tp>=15) break;
    if(play){ const amp=.75+r()*.2, s0=Math.floor(tp*sr);

    tp+=next; k++;
  }
  for(let i=0;i<N;i++){ const tt=i/sr, run = tt<15? 1 : Math.max(0,1-(tt-15)/0.8);
    a[i]+= run*(.05*Math.sin(2*Math.PI*100*tt)+.03*(r()*2-1)) + .006*(r()*2-1); a[i]*=.8; }

}
function analyse(x,sr){
  const hop=Math.round(sr*.005), F=Math.floor(x.length/hop), env=new Float32Array(F);
  for(let f=0;f<F;f++){ let s=0; for(let i=0;i<hop;i++){ const v=x[f*hop+i]; s+=v*v; } env[f]=Math.sqrt(s/hop); }

  const sm=new Float32Array(F); for(let f=0;f<F;f++){ sm[f]=(env[f]+(env[f-1]||env[f])+(env[f+1]||env[f]))/3; }
  const sorted=Float32Array.from(sm).sort(), q=p=>sorted[Math.min(F-1,Math.floor(p*F))];
  const floor=q(.3), top=q(.985), thr=floor+.35*(top-floor), minGap=Math.round(.12/.005);
  const picks=[]; let last=-1e9;
  for(let f=1;f<F-1;f++){ if(sm[f]>thr && sm[f]>=sm[f-1] && sm[f]>=sm[f+1] && f-last>=minGap){ picks.push(f*.005); last=f; } }

const LOC={en:'en-IN',ta:'ta-IN',hi:'hi-IN',te:'te-IN',ml:'ml-IN',kn:'kn-IN'};

    const eff = [.775+r()*.03, .81, .855+r()*.015][ph];
    const faulty = Math.round([880+r()*220, 600, 270+r()*70][ph]);

      x.fillStyle=css('--ink-3'); x.font='11px '+css('--ui'); x.textAlign='center'; x.fillText(lab(m),xc,h-6); });
    const ix=Lp+bw*INST; x.strokeStyle=css('--accent'); x.setLineDash([4,4]); x.beginPath(); x.moveTo(ix,T); x.lineTo(ix,h-B); x.stroke(); x.setLineDash([]); }
}
